name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: PR hygiene
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require issue link in PR body
        shell: bash
        run: |
          BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          if echo "$BODY" | grep -Eiq '#[0-9]+'; then
            echo "Issue link found in PR body."
          else
            echo "PR body must reference an issue, e.g. 'Closes #123'."
            exit 1
          fi

  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      english_learn: ${{ steps.filter.outputs.english_learn }}
      nested_english_learn: ${{ steps.filter.outputs.nested_english_learn }}
    steps:
      - name: Checkout for diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            english_learn:
              - 'english-learn/**'
            nested_english_learn:
              - 'software/english-learn/**'

  quality-english-learn:
    name: quality (english-learn)
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.english_learn == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: english-learn/package-lock.json

      - name: Install dependencies
        working-directory: english-learn
        run: npm ci

      - name: Lint
        working-directory: english-learn
        run: npm run lint --if-present

      - name: Build
        working-directory: english-learn
        run: npm run build --if-present

      - name: Typecheck
        working-directory: english-learn
        run: npm run typecheck --if-present

      - name: Test
        working-directory: english-learn
        run: npm run test --if-present

  quality-nested-english-learn:
    name: quality (software/english-learn)
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.nested_english_learn == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: software/english-learn/package-lock.json

      - name: Install dependencies
        working-directory: software/english-learn
        run: npm ci

      - name: Lint
        working-directory: software/english-learn
        run: npm run lint --if-present

      - name: Build
        working-directory: software/english-learn
        run: npm run build --if-present

      - name: Typecheck
        working-directory: software/english-learn
        run: npm run typecheck --if-present

      - name: Test
        working-directory: software/english-learn
        run: npm run test --if-present
